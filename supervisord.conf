[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[program:fastapi]
command=uvicorn main:app --host 127.0.0.1 --port 8000 --workers 2
directory=/app/backend
user=faraday
autostart=true
autorestart=true
stdout_logfile=/var/log/fastapi.log
stderr_logfile=/var/log/fastapi.log
stdout_logfile_maxbytes=10MB
environment=DB_PATH="/data/faraday.db",DATABASE_URL="%(ENV_DATABASE_URL)s",SECRET_KEY="%(ENV_SECRET_KEY)s",TOKEN_EXPIRE_MINUTES="%(ENV_TOKEN_EXPIRE_MINUTES)s",COOKIE_SECURE="%(ENV_COOKIE_SECURE)s"

[program:nextjs]
command=node server.js
directory=/app/frontend
user=faraday
autostart=true
autorestart=true
stdout_logfile=/var/log/nextjs.log
stderr_logfile=/var/log/nextjs.log
stdout_logfile_maxbytes=10MB
environment=PORT="3000",HOSTNAME="0.0.0.0",NODE_ENV="production"
